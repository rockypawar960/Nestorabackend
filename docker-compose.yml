version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: nestora-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}"
      MYSQL_DATABASE: nestora
      MYSQL_USER: "${DB_USERNAME:?Set DB_USERNAME in .env}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
    ports:
      - "3306:3306"
    volumes:
      - nestora_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - nestora-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nestora-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/nestora?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env}"
      JWT_ACCESS_EXPIRY_MS: ${JWT_ACCESS_EXPIRY_MS:-900000}
      JWT_REFRESH_EXPIRY_MS: ${JWT_REFRESH_EXPIRY_MS:-604800000}
      ADMIN_EMAIL: "${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}"
      ADMIN_NAME: ${ADMIN_NAME:-Nestora Admin}
      MAIL_USERNAME: "${MAIL_USERNAME:?Set MAIL_USERNAME in .env}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:?Set MAIL_PASSWORD in .env}"
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"
    networks:
      - nestora-network

volumes:
  nestora_mysql_data:

networks:
  nestora-network:
    driver: bridge
